name: Deploy Jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/jobs/**"
      - "packages/shared/**"
      - "packages/db/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - run: railway up --ci
